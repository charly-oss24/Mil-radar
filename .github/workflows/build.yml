name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Java einrichten
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Web-Dateien vorbereiten
        run: |
          mkdir -p www
          cp index.html www/

      - name: App-Hülle & Plugins erstellen (Capacitor)
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/android @capacitor/local-notifications @capacitor/geolocation @capawesome/capacitor-background-task
          npx cap init "Mil-Air Alert" "com.charly.milradar" --web-dir www
          
          # Native HTTP-Bridge & Background-Handling aktivieren
          node -e '
            const fs = require("fs");
            const file = "capacitor.config.json";
            let cfg = fs.existsSync(file) ? JSON.parse(fs.readFileSync(file)) : {};
            cfg.plugins = cfg.plugins || {};
            cfg.plugins.CapacitorHttp = { enabled: true };
            cfg.server = cfg.server || {};
            cfg.server.cleartext = true;
            fs.writeFileSync(file, JSON.stringify(cfg, null, 2));
          '
          
          npx cap add android

      - name: Berechtigungen & native Konfiguration eintragen
        run: |
          # Berechtigungen eintragen
          sed -i '/<application/i <uses-permission android:name="android.permission.INTERNET" />\n<uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n<uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n<uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n<uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n<uses-permission android:name="android.permission.VIBRATE" />\n<uses-permission android:name="android.permission.WAKE_LOCK" />\n<uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n<uses-permission android:name="android.permission.FOREGROUND_SERVICE_LOCATION" />\n<uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />\n<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />' android/app/src/main/AndroidManifest.xml
          
          # CleartextTraffic erlauben
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

          # Duplicate-Class-Fix für Kotlin/Gradle
          echo 'configurations.all { exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk7"; exclude group: "org.jetbrains.kotlin", module: "kotlin-stdlib-jdk8" }' >> android/app/build.gradle
          
          npx cap sync android

      - name: APK bauen
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: APK als Download bereitstellen
        uses: actions/upload-artifact@v4
        with:
          name: Mil-Radar-App
          path: android/app/build/outputs/apk/debug/app-debug.apk
