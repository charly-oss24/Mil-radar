<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mil-Air Radar 50km</title>
  
  <!-- Leaflet Karten-Bibliothek (kostenlos & ohne API-Key) -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --accent: #238636;
      --alert: #f85149;
      --jet: #d29922;
      --heli: #a371f7;
      --text: #c9d1d9;
      --text-bright: #ffffff;
      --bearing: #58a6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      padding: 12px;
      padding-bottom: 50px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: var(--card-bg);
      border-radius: 10px;
      border: 1px solid var(--border);
      margin-bottom: 12px;
    }
    h1 { font-size: 1.1rem; color: var(--text-bright); }
    .status-badge {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 12px;
      background: #21262d;
      border: 1px solid var(--border);
    }
    .status-badge.scanning { color: #58a6ff; border-color: #58a6ff; }
    
    #map {
      width: 100%;
      height: 280px;
      border-radius: 10px;
      border: 1px solid var(--border);
      margin-bottom: 12px;
      background: #0d1117;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    button {
      background: #21262d;
      color: var(--text-bright);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }
    button.active {
      background: #1f6feb;
      border-color: #388bfd;
    }
    #meta-bar {
      font-size: 0.75rem;
      color: #8b949e;
      margin-bottom: 12px;
      padding: 0 4px;
      display: flex;
      justify-content: space-between;
    }
    .flight-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-left: 4px solid var(--alert);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .flight-card.is-jet {
      border-left: 4px solid var(--jet);
    }
    .flight-card.is-heli {
      border-left: 4px solid var(--heli);
    }
    .flight-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
    }
    .callsign {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--text-bright);
      letter-spacing: 0.5px;
    }
    .badge-category {
      font-size: 0.7rem;
      font-weight: bold;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: 4px;
      text-transform: uppercase;
    }
    .badge-jet { background: rgba(210, 153, 34, 0.25); color: #e3b341; border: 1px solid #d29922; }
    .badge-heli { background: rgba(163, 113, 247, 0.25); color: #d2a8ff; border: 1px solid #a371f7; }
    .badge-mil { background: #30363d; color: #f0f6fc; }

    .distance-tag {
      color: var(--alert);
      font-weight: bold;
      font-size: 0.95rem;
    }
    .bearing-box {
      background: #0d1117;
      border: 1px solid #21262d;
      border-radius: 6px;
      padding: 8px 10px;
      margin: 8px 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .bearing-arrow {
      font-size: 1.4rem;
      color: var(--bearing);
      display: inline-block;
      transform-origin: center;
    }
    .bearing-text {
      font-size: 0.85rem;
      color: var(--text-bright);
    }
    .bearing-target {
      font-weight: bold;
      color: var(--bearing);
    }
    .flight-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      font-size: 0.75rem;
      color: #8b949e;
      margin-top: 6px;
    }
    .flight-stats span strong {
      color: var(--text);
      display: block;
    }
    .empty-state {
      text-align: center;
      padding: 30px 16px;
      color: #8b949e;
      font-size: 0.9rem;
    }

    /* Flugzeug-Marker auf der Karte */
    .plane-marker {
      font-size: 18px;
      text-align: center;
      line-height: 20px;
      transition: transform 0.5s linear;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>Mil-Air Alert</h1>
      <div style="font-size: 0.7rem; color: #8b949e;">Radius: 50 km (Militär-Filter)</div>
    </div>
    <div id="statusBadge" class="status-badge">Standort wird ermittelt...</div>
  </header>

  <!-- Live Karte -->
  <div id="map"></div>

  <div class="controls">
    <button id="toggleAudioBtn" onclick="toggleAudio()">Audio-Alarm: AUS</button>
    <button onclick="fetchMilitaryFlights()">Jetzt Scannen</button>
  </div>

  <div id="meta-bar">
    <span id="posDisplay">Standort: Unbekannt</span>
    <span id="countdown">Nächster Scan: 10s</span>
  </div>

  <div id="flightList">
    <div class="empty-state">Scanne Luftraum im 50-km-Umkreis...</div>
  </div>

  <script>
    let userLat = 48.9500;
    let userLon = 8.5772;
    let audioEnabled = false;
    let knownFlights = new Set();
    let countdownSec = 10;
    const MAX_DISTANCE_KM = 50;

    let map = null;
    let userMarker = null;
    let radiusCircle = null;
    let planeMarkers = {};

    // Typen-Kategorisierung (ICAO-Codes)
    const FIGHTER_JETS = ["EF20", "TOR", "F16", "F35", "FA18", "EUFI", "A10", "F15", "M2000", "RAF"];
    const HELICOPTERS = ["H145", "EC45", "TIGR", "NH90", "CH53", "H60", "AH64", "EC35", "AS32"];

    const sectorLandmarks = {
      "N": "Richtung Bretten / Bruchsal",
      "NO": "Richtung Maulbronn / Heilbronn",
      "O": "Richtung Mühlacker / Stuttgart",
      "SO": "Richtung Pforzheim / Schwarzwald-Pforte",
      "S": "Richtung Bad Wildbad / Nordschwarzwald",
      "SW": "Richtung Freudenstadt / Baden-Baden",
      "W": "Richtung Karlsbad / Karlsruhe",
      "NW": "Richtung Stutensee / Philippsburg"
    };

    function initMap() {
      map = L.map('map', { attributionControl: false }).setView([userLat, userLon], 9);
      
      // Dunkles Kartendesign (CartoDB DarkMatter)
      L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
        maxZoom: 18
      }).addTo(map);

      // Eigener Standort-Marker
      const homeIcon = L.divIcon({
        className: 'home-marker',
        html: '<div style="background:#58a6ff; width:12px; height:12px; border-radius:50%; border:2px solid #fff; box-shadow:0 0 8px #58a6ff;"></div>',
        iconSize: [12, 12]
      });
      userMarker = L.marker([userLat, userLon], { icon: homeIcon }).addTo(map).bindPopup("Dein Standort");

      // 50-km-Radiuskreis
      radiusCircle = L.circle([userLat, userLon], {
        color: '#58a6ff',
        fillColor: '#58a6ff',
        fillOpacity: 0.05,
        weight: 1.5,
        dashArray: '4, 6',
        radius: MAX_DISTANCE_KM * 1000
      }).addTo(map);
    }

    function updateMapLocation() {
      if (!map) return;
      userMarker.setLatLng([userLat, userLon]);
      radiusCircle.setLatLng([userLat, userLon]);
      map.setView([userLat, userLon], 9);
    }

    function classifyAircraft(type) {
      if (!type) return { cat: "MIL", label: "Militär", class: "badge-mil", cardClass: "" };
      const t = type.toUpperCase().trim();
      if (FIGHTER_JETS.some(j => t.includes(j))) {
        return { cat: "JET", label: "⚡ Jet", class: "badge-jet", cardClass: "is-jet" };
      }
      if (HELICOPTERS.some(h => t.includes(h))) {
        return { cat: "HELI", label: "🚁 Heli", class: "badge-heli", cardClass: "is-heli" };
      }
      return { cat: "MIL", label: t, class: "badge-mil", cardClass: "" };
    }

    function playAlertTone() {
      if (!audioEnabled) return;
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        osc.frequency.setValueAtTime(1200, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.35);
      } catch (e) {
        console.error("Audio-Fehler:", e);
      }
    }

    function toggleAudio() {
      audioEnabled = !audioEnabled;
      const btn = document.getElementById("toggleAudioBtn");
      if (audioEnabled) {
        btn.classList.add("active");
        btn.innerText = "Audio-Alarm: AN";
        playAlertTone();
      } else {
        btn.classList.remove("active");
        btn.innerText = "Audio-Alarm: AUS";
      }
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    function calculateBearing(lat1, lon1, lat2, lon2) {
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;

      const y = Math.sin(Δλ) * Math.cos(φ2);
      const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
      const θ = Math.atan2(y, x);
      return (θ * 180 / Math.PI + 360) % 360;
    }

    function getCompassSector(degrees) {
      const directions = ["N", "NO", "O", "SO", "S", "SW", "W", "NW"];
      const index = Math.round(degrees / 45) % 8;
      return directions[index];
    }

    function initGPS() {
      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            userLat = pos.coords.latitude;
            userLon = pos.coords.longitude;
            document.getElementById("posDisplay").innerText = `Standort: ${userLat.toFixed(3)}N, ${userLon.toFixed(3)}E`;
            updateMapLocation();
            fetchMilitaryFlights();
          },
          (err) => {
            console.warn("GPS-Fehler, nutze Remchingen:", err);
            document.getElementById("posDisplay").innerText = "Standort: Remchingen (Standard)";
            fetchMilitaryFlights();
          },
          { enableHighAccuracy: true, timeout: 8000 }
        );
      } else {
        document.getElementById("posDisplay").innerText = "Standort: Remchingen (Standard)";
        fetchMilitaryFlights();
      }
    }

    async function fetchMilitaryFlights() {
      const badge = document.getElementById("statusBadge");
      badge.classList.add("scanning");
      badge.innerText = "Aktualisiere...";

      try {
        const response = await fetch("https://api.airplanes.live/v2/mil");
        if (!response.ok) throw new Error("Status: " + response.status);
        const data = await response.json();
        
        const milFleet = data.ac || [];
        processFlights(milFleet);
        
        badge.classList.remove("scanning");
        badge.innerText = `Online (${milFleet.length} Flieger)`;
      } catch (err) {
        try {
          const backupRes = await fetch("https://api.adsb.lol/v2/mil");
          if (!backupRes.ok) throw new Error("Backup Status: " + backupRes.status);
          const backupData = await backupRes.json();
          const milFleet = backupData.ac || [];
          processFlights(milFleet);
          badge.classList.remove("scanning");
          badge.innerText = `Online (${milFleet.length} Flieger)`;
        } catch (backupErr) {
          console.error("Alle APIs fehlgeschlagen:", backupErr);
          badge.classList.remove("scanning");
          badge.innerText = "Verbindungsfehler";
        }
      }
    }

    function updateMapMarkers(flights) {
      const currentIds = new Set();

      flights.forEach(f => {
        currentIds.add(f.id);
        const symbol = f.info.cat === "JET" ? "⚡" : (f.info.cat === "HELI" ? "🚁" : "✈️");
        const heading = f.track || 0;

        const iconHtml = `
          <div class="plane-marker" style="transform: rotate(${heading}deg);">${symbol}</div>
        `;
        const icon = L.divIcon({
          className: 'plane-div-icon',
          html: iconHtml,
          iconSize: [20, 20],
          iconAnchor: [10, 10]
        });

        if (planeMarkers[f.id]) {
          planeMarkers[f.id].setLatLng([f.lat, f.lon]);
          planeMarkers[f.id].setIcon(icon);
        } else {
          const marker = L.marker([f.lat, f.lon], { icon: icon }).addTo(map);
          marker.bindPopup(`<b>${f.callsign}</b><br>${f.type}<br>Distanz: ${f.dist.toFixed(1)} km`);
          planeMarkers[f.id] = marker;
        }
      });

      // Entfernte Flieger von der Karte löschen
      Object.keys(planeMarkers).forEach(id => {
        if (!currentIds.has(id)) {
          map.removeLayer(planeMarkers[id]);
          delete planeMarkers[id];
        }
      });
    }

    function processFlights(aircraftList) {
      const nearby = [];
      let newAlert = false;

      aircraftList.forEach(ac => {
        if (!ac.lat || !ac.lon) return;

        const dist = calculateDistance(userLat, userLon, ac.lat, ac.lon);
        if (dist <= MAX_DISTANCE_KM) {
          const bearing = calculateBearing(userLat, userLon, ac.lat, ac.lon);
          const sector = getCompassSector(bearing);
          const landmark = sectorLandmarks[sector] || "";
          const id = ac.hex || ac.flight || `${ac.lat}-${ac.lon}`;
          const type = ac.t || "MIL";
          const info = classifyAircraft(type);

          if (!knownFlights.has(id)) {
            knownFlights.add(id);
            newAlert = true;
          }

          nearby.push({
            id: id,
            hex: ac.hex,
            lat: ac.lat,
            lon: ac.lon,
            callsign: (ac.flight || ac.r || ac.hex || "UNKNOWN").trim(),
            type: type,
            info: info,
            dist: dist,
            bearing: Math.round(bearing),
            sector: sector,
            landmark: landmark,
            alt: ac.alt_geom || ac.alt_baro || 0,
            speed: ac.gs || 0,
            track: ac.track || 0
          });
        }
      });

      if (newAlert && nearby.length > 0) {
        playAlertTone();
      }

      updateMapMarkers(nearby);
      renderList(nearby);
    }

    function renderList(flights) {
      const listEl = document.getElementById("flightList");
      if (flights.length === 0) {
        listEl.innerHTML = `
          <div class="empty-state">
            <div style="font-size: 2.2rem; margin-bottom: 8px;">🛡️</div>
            Aktuell keine Militärflieger im 50-km-Radius registriert.
          </div>
        `;
        return;
      }

      // Fighter Jets zuerst sortieren, dann nach Nähe
      flights.sort((a, b) => {
        if (a.info.cat === "JET" && b.info.cat !== "JET") return -1;
        if (b.info.cat === "JET" && a.info.cat !== "JET") return 1;
        return a.dist - b.dist;
      });

      let html = "";
      flights.forEach(f => {
        const altMeters = Math.round(f.alt * 0.3048);
        const speedKmh = Math.round(f.speed * 1.852);

        html += `
          <div class="flight-card ${f.info.cardClass}">
            <div class="flight-head">
              <div>
                <span class="callsign">${f.callsign}</span>
                <span class="badge-category ${f.info.class}">${f.info.label}</span>
              </div>
              <span class="distance-tag">${f.dist.toFixed(1)} km</span>
            </div>

            <div class="bearing-box">
              <span class="bearing-arrow" style="transform: rotate(${f.bearing}deg);">↑</span>
              <div class="bearing-text">
                Blickrichtung: <strong>${f.sector} (${f.bearing}°)</strong><br>
                <span class="bearing-target">👉 Schau ${f.landmark}</span>
              </div>
            </div>

            <div class="flight-stats">
              <span>Typ<strong>${f.type}</strong></span>
              <span>Höhe<strong>${altMeters} m</strong></span>
              <span>Speed<strong>${speedKmh} km/h</strong></span>
            </div>
          </div>
        `;
      });
      listEl.innerHTML = html;
    }

    setInterval(() => {
      countdownSec--;
      if (countdownSec <= 0) {
        fetchMilitaryFlights();
        countdownSec = 10;
      }
      document.getElementById("countdown").innerText = `Nächster Scan: ${countdownSec}s`;
    }, 1000);

    // Initialisierung
    initMap();
    initGPS();
  </script>
</body>
</html>
