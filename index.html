<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Mil-Air Radar 50km</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --accent: #238636;
      --alert: #f85149;
      --text: #c9d1d9;
      --text-bright: #ffffff;
      --bearing: #58a6ff;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, monospace;
      padding: 12px;
      padding-bottom: 40px;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px;
      background: var(--card-bg);
      border-radius: 10px;
      border: 1px solid var(--border);
      margin-bottom: 12px;
    }
    h1 { font-size: 1.1rem; color: var(--text-bright); }
    .status-badge {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 12px;
      background: #21262d;
      border: 1px solid var(--border);
    }
    .status-badge.scanning { color: #58a6ff; border-color: #58a6ff; }
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 12px;
    }
    button {
      background: #21262d;
      color: var(--text-bright);
      border: 1px solid var(--border);
      padding: 10px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
    }
    button.active {
      background: #1f6feb;
      border-color: #388bfd;
    }
    #meta-bar {
      font-size: 0.75rem;
      color: #8b949e;
      margin-bottom: 12px;
      padding: 0 4px;
      display: flex;
      justify-content: space-between;
    }
    .flight-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-left: 4px solid var(--alert);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .flight-head {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
    }
    .callsign {
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--text-bright);
      letter-spacing: 0.5px;
    }
    .type-badge {
      background: #30363d;
      color: #f0f6fc;
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
    }
    .distance-tag {
      color: var(--alert);
      font-weight: bold;
      font-size: 0.95rem;
    }
    .bearing-box {
      background: #0d1117;
      border: 1px solid #21262d;
      border-radius: 6px;
      padding: 8px 10px;
      margin: 8px 0;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .bearing-arrow {
      font-size: 1.4rem;
      color: var(--bearing);
      display: inline-block;
      transform-origin: center;
    }
    .bearing-text {
      font-size: 0.85rem;
      color: var(--text-bright);
    }
    .bearing-target {
      font-weight: bold;
      color: var(--bearing);
    }
    .flight-stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
      font-size: 0.75rem;
      color: #8b949e;
      margin-top: 6px;
    }
    .flight-stats span strong {
      color: var(--text);
      display: block;
    }
    .empty-state {
      text-align: center;
      padding: 40px 16px;
      color: #8b949e;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>Mil-Air Alert</h1>
      <div style="font-size: 0.7rem; color: #8b949e;">Radius: 50 km (Militär-Filter)</div>
    </div>
    <div id="statusBadge" class="status-badge">Standort wird ermittelt...</div>
  </header>

  <div class="controls">
    <button id="toggleAudioBtn" onclick="toggleAudio()">Audio-Alarm: AUS</button>
    <button onclick="fetchMilitaryFlights()">Jetzt Scannen</button>
  </div>

  <div id="meta-bar">
    <span id="posDisplay">Standort: Unbekannt</span>
    <span id="countdown">Nächster Scan: 10s</span>
  </div>

  <div id="flightList">
    <div class="empty-state">Scanne Luftraum im 50-km-Umkreis...</div>
  </div>

  <script>
    let userLat = 48.9500;
    let userLon = 8.5772;
    let audioEnabled = false;
    let knownFlights = new Set();
    let countdownSec = 10;
    const MAX_DISTANCE_KM = 50;

    const sectorLandmarks = {
      "N": "Richtung Bretten / Bruchsal",
      "NO": "Richtung Maulbronn / Heilbronn",
      "O": "Richtung Mühlacker / Stuttgart",
      "SO": "Richtung Pforzheim / Schwarzwald-Pforte",
      "S": "Richtung Bad Wildbad / Nordschwarzwald",
      "SW": "Richtung Freudenstadt / Baden-Baden",
      "W": "Richtung Karlsbad / Karlsruhe",
      "NW": "Richtung Stutensee / Philippsburg"
    };

    function playAlertTone() {
      if (!audioEnabled) return;
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "sawtooth";
        osc.frequency.setValueAtTime(880, audioCtx.currentTime);
        osc.frequency.setValueAtTime(1200, audioCtx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.35);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.35);
      } catch (e) {
        console.error("Audio-Fehler:", e);
      }
    }

    function toggleAudio() {
      audioEnabled = !audioEnabled;
      const btn = document.getElementById("toggleAudioBtn");
      if (audioEnabled) {
        btn.classList.add("active");
        btn.innerText = "Audio-Alarm: AN";
        playAlertTone();
      } else {
        btn.classList.remove("active");
        btn.innerText = "Audio-Alarm: AUS";
      }
    }

    function calculateDistance(lat1, lon1, lat2, lon2) {
      const R = 6371;
      const dLat = (lat2 - lat1) * Math.PI / 180;
      const dLon = (lon2 - lon1) * Math.PI / 180;
      const a = 
        Math.sin(dLat/2) * Math.sin(dLat/2) +
        Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * 
        Math.sin(dLon/2) * Math.sin(dLon/2);
      const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
      return R * c;
    }

    function calculateBearing(lat1, lon1, lat2, lon2) {
      const φ1 = lat1 * Math.PI / 180;
      const φ2 = lat2 * Math.PI / 180;
      const Δλ = (lon2 - lon1) * Math.PI / 180;

      const y = Math.sin(Δλ) * Math.cos(φ2);
      const x = Math.cos(φ1) * Math.sin(φ2) - Math.sin(φ1) * Math.cos(φ2) * Math.cos(Δλ);
      const θ = Math.atan2(y, x);
      return (θ * 180 / Math.PI + 360) % 360;
    }

    function getCompassSector(degrees) {
      const directions = ["N", "NO", "O", "SO", "S", "SW", "W", "NW"];
      const index = Math.round(degrees / 45) % 8;
      return directions[index];
    }

    function initGPS() {
      if ("geolocation" in navigator) {
        navigator.geolocation.getCurrentPosition(
          (pos) => {
            userLat = pos.coords.latitude;
            userLon = pos.coords.longitude;
            document.getElementById("posDisplay").innerText = `Standort: ${userLat.toFixed(3)}N, ${userLon.toFixed(3)}E`;
            fetchMilitaryFlights();
          },
          (err) => {
            console.warn("GPS-Fehler, nutze Remchingen:", err);
            document.getElementById("posDisplay").innerText = "Standort: Remchingen (Standard)";
            fetchMilitaryFlights();
          },
          { enableHighAccuracy: true, timeout: 8000 }
        );
      } else {
        document.getElementById("posDisplay").innerText = "Standort: Remchingen (Standard)";
        fetchMilitaryFlights();
      }
    }

    async function fetchMilitaryFlights() {
      const badge = document.getElementById("statusBadge");
      badge.classList.add("scanning");
      badge.innerText = "Aktualisiere...";

      try {
        const response = await fetch("https://api.airplanes.live/v2/mil");
        if (!response.ok) throw new Error("Status: " + response.status);
        const data = await response.json();
        
        const milFleet = data.ac || [];
        processFlights(milFleet);
        
        badge.classList.remove("scanning");
        badge.innerText = `Online (${milFleet.length} Flieger)`;
      } catch (err) {
        console.warn("Airplanes.live API fehlgeschlagen, nutze adsb.lol...", err);
        try {
          const backupRes = await fetch("https://api.adsb.lol/v2/mil");
          if (!backupRes.ok) throw new Error("Backup Status: " + backupRes.status);
          const backupData = await backupRes.json();
          const milFleet = backupData.ac || [];
          processFlights(milFleet);
          badge.classList.remove("scanning");
          badge.innerText = `Online (${milFleet.length} Flieger)`;
        } catch (backupErr) {
          console.error("Alle APIs fehlgeschlagen:", backupErr);
          badge.classList.remove("scanning");
          badge.innerText = "Verbindungsfehler";
        }
      }
    }

    function processFlights(aircraftList) {
      const nearby = [];
      let newAlert = false;

      aircraftList.forEach(ac => {
        if (!ac.lat || !ac.lon) return;

        const dist = calculateDistance(userLat, userLon, ac.lat, ac.lon);
        if (dist <= MAX_DISTANCE_KM) {
          const bearing = calculateBearing(userLat, userLon, ac.lat, ac.lon);
          const sector = getCompassSector(bearing);
          const landmark = sectorLandmarks[sector] || "";

          const id = ac.hex || ac.flight || `${ac.lat}-${ac.lon}`;
          if (!knownFlights.has(id)) {
            knownFlights.add(id);
            newAlert = true;
          }

          nearby.push({
            hex: ac.hex,
            callsign: (ac.flight || ac.r || ac.hex || "UNKNOWN").trim(),
            type: ac.t || "Militärflieger",
            desc: ac.desc || "",
            dist: dist,
            bearing: Math.round(bearing),
            sector: sector,
            landmark: landmark,
            alt: ac.alt_geom || ac.alt_baro || 0,
            speed: ac.gs || 0,
            track: ac.track || 0
          });
        }
      });

      if (newAlert && nearby.length > 0) {
        playAlertTone();
      }

      renderList(nearby);
    }

    function renderList(flights) {
      const listEl = document.getElementById("flightList");
      if (flights.length === 0) {
        listEl.innerHTML = `
          <div class="empty-state">
            <div style="font-size: 2.2rem; margin-bottom: 8px;">🛡️</div>
            Aktuell keine Militärflieger im 50-km-Radius registriert.
          </div>
        `;
        return;
      }

      flights.sort((a, b) => a.dist - b.dist);

      let html = "";
      flights.forEach(f => {
        const altMeters = Math.round(f.alt * 0.3048);
        const speedKmh = Math.round(f.speed * 1.852);

        html += `
          <div class="flight-card">
            <div class="flight-head">
              <div>
                <span class="callsign">${f.callsign}</span>
                <span class="type-badge">${f.type}</span>
              </div>
              <span class="distance-tag">${f.dist.toFixed(1)} km</span>
            </div>

            <div class="bearing-box">
              <span class="bearing-arrow" style="transform: rotate(${f.bearing}deg);">↑</span>
              <div class="bearing-text">
                Blickrichtung: <strong>${f.sector} (${f.bearing}°)</strong><br>
                <span class="bearing-target">👉 Schau ${f.landmark}</span>
              </div>
            </div>

            <div class="flight-stats">
              <span>Höhe<strong>${altMeters} m (${f.alt} ft)</strong></span>
              <span>Speed<strong>${speedKmh} km/h</strong></span>
              <span>Kurs<strong>${Math.round(f.track)}°</strong></span>
            </div>
          </div>
        `;
      });
      listEl.innerHTML = html;
    }

    setInterval(() => {
      countdownSec--;
      if (countdownSec <= 0) {
        fetchMilitaryFlights();
        countdownSec = 10;
      }
      document.getElementById("countdown").innerText = `Nächster Scan: ${countdownSec}s`;
    }, 1000);

    initGPS();
  </script>
</body>
</html>
